name: Android release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to build, for example v0.1.0-alpha'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Decode Android signing keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || {
            echo "ANDROID_KEYSTORE_BASE64 is not configured."
            exit 1
          }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/golfsg-release.keystore"
          chmod 600 "$RUNNER_TEMP/golfsg-release.keystore"

      - name: Build and sign APK
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD" || {
            echo "ANDROID_KEYSTORE_PASSWORD is not configured."
            exit 1
          }
          test -n "$ANDROID_KEY_PASSWORD" || {
            echo "ANDROID_KEY_PASSWORD is not configured."
            exit 1
          }

          dotnet publish src/GolfSG/GolfSG.csproj \
            -f net10.0-android \
            -c Release \
            -p:AndroidPackageFormat=apk \
            -p:PublishTrimmed=false \
            -p:RunAOTCompilation=false \
            -p:AndroidLinkMode=None \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="$RUNNER_TEMP/golfsg-release.keystore" \
            -p:AndroidSigningKeyAlias=golfsg \
            -p:AndroidSigningKeyPass=env:ANDROID_KEY_PASSWORD \
            -p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASSWORD

      - name: Prepare release assets
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          mkdir -p artifacts
          apk_path=$(find src/GolfSG/bin/Release/net10.0-android/publish -type f -iname '*-Signed.apk' -print -quit)
          if [ -z "$apk_path" ]; then
            echo "No signed APK was produced."
            exit 1
          fi

          cp "$apk_path" "artifacts/GolfSG-${RELEASE_TAG}.apk"
          sha256sum "artifacts/GolfSG-${RELEASE_TAG}.apk" > "artifacts/GolfSG-${RELEASE_TAG}.apk.sha256"

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              "artifacts/GolfSG-${RELEASE_TAG}.apk" \
              "artifacts/GolfSG-${RELEASE_TAG}.apk.sha256" \
              --clobber
            exit 0
          fi

          notes_args=(--generate-notes)
          notes_file="docs/release-notes/${RELEASE_TAG}.md"
          if [ -f "$notes_file" ]; then
            notes_args=(--notes-file "$notes_file")
          fi

          prerelease_args=()
          if [[ "$RELEASE_TAG" =~ -(alpha|beta|rc)([.-]|$) ]]; then
            prerelease_args+=(--prerelease)
          fi

          gh release create "$RELEASE_TAG" \
            "artifacts/GolfSG-${RELEASE_TAG}.apk" \
            "artifacts/GolfSG-${RELEASE_TAG}.apk.sha256" \
            --title "GolfSG ${RELEASE_TAG}" \
            "${notes_args[@]}" \
            "${prerelease_args[@]}"
