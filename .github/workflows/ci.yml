name: CI

on:
  push:
    branches:
      - master
      - dev
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Do not interrupt a dev run once database setup/deployment may have started.
  cancel-in-progress: ${{ github.ref != 'refs/heads/dev' }}

permissions:
  contents: read

jobs:
  test:
    name: Tests and dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302

      - name: Restore tests
        run: dotnet restore tests/GolfSG.Tests/GolfSG.Tests.csproj --locked-mode

      - name: Run Release tests
        run: dotnet test tests/GolfSG.Tests/GolfSG.Tests.csproj -c Release --no-restore

      - name: Restore page interaction tests
        run: dotnet restore tests/GolfSG.PageTests/GolfSG.PageTests.csproj --locked-mode

      - name: Run page interaction tests
        run: dotnet test tests/GolfSG.PageTests/GolfSG.PageTests.csproj -c Release --no-restore

      - name: Test staging delivery guards
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Verify staging endpoint isolation
        run: >-
          dotnet test tests/GolfSG.PageTests/GolfSG.PageTests.csproj
          -c Release --no-restore
          -p:GolfSGEnvironment=Staging
          -p:GolfSGStagingApiAddress=https://staging.example.invalid/

      - name: Check test dependencies for known vulnerabilities
        shell: bash
        run: |
          dotnet list tests/GolfSG.Tests/GolfSG.Tests.csproj package --vulnerable --include-transitive --no-restore --format json --output-version 1 > vulnerability-report.json
          jq -e '((.errors // []) | length == 0) and (.projects | type == "array") and ([.projects[] | (.frameworks // [])[] | ((.topLevelPackages // []) + (.transitivePackages // []))[] | select((.vulnerabilities // []) | length > 0)] | length == 0)' vulnerability-report.json

  backend:
    name: API boundaries and PostgreSQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local_test_password
          POSTGRES_DB: golfsg_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ConnectionStrings__DatabaseSetup: Host=localhost;Port=5432;Database=golfsg_test_ci;Username=postgres;Password=local_test_password
      GOLFSG_TEST_DATABASE: Host=localhost;Port=5432;Database=golfsg_test_ci;Username=postgres;Password=local_test_password
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302

      - name: Restore backend tests and setup tool
        run: dotnet restore tests/GolfSG.Api.Tests/GolfSG.Api.Tests.csproj --locked-mode

      - name: Prepare the disposable test database
        run: dotnet run --project src/GolfSG.Database.Setup/GolfSG.Database.Setup.csproj -c Release --no-restore

      - name: Run backend tests
        run: dotnet test tests/GolfSG.Api.Tests/GolfSG.Api.Tests.csproj -c Release --no-restore

      - name: Build the API container
        run: docker build --tag golfsg-api-ci:${{ github.sha }} .

      - name: Check backend dependencies for known vulnerabilities
        shell: bash
        run: |
          dotnet list tests/GolfSG.Api.Tests/GolfSG.Api.Tests.csproj package --vulnerable --include-transitive --no-restore --format json --output-version 1 > backend-vulnerability-report.json
          jq -e '((.errors // []) | length == 0) and (.projects | type == "array") and ([.projects[] | (.frameworks // [])[] | ((.topLevelPackages // []) + (.transitivePackages // []))[] | select((.vulnerabilities // []) | length > 0)] | length == 0)' backend-vulnerability-report.json

  android:
    name: Android Release build
    runs-on: ubuntu-latest
    needs: test
    env:
      GOLFSG_BUILD_ENVIRONMENT: ${{ (github.ref == 'refs/heads/dev' || github.base_ref == 'dev') && 'Staging' || 'Production' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302

      - name: Install pinned-workload manifests
        run: dotnet workload install maui-android --skip-manifest-update

      - name: Restore Android app
        run: dotnet restore src/GolfSG/GolfSG.csproj

      - name: Check Android dependencies for known vulnerabilities
        shell: bash
        run: |
          dotnet list src/GolfSG/GolfSG.csproj package --framework net10.0-android --vulnerable --include-transitive --no-restore --format json --output-version 1 > vulnerability-report.json
          jq -e '((.errors // []) | length == 0) and (.projects | type == "array") and ([.projects[] | (.frameworks // [])[] | ((.topLevelPackages // []) + (.transitivePackages // []))[] | select((.vulnerabilities // []) | length > 0)] | length == 0)' vulnerability-report.json

      - name: Publish Android Release packages
        shell: bash
        run: |
          environment_args=(-p:GolfSGEnvironment="$GOLFSG_BUILD_ENVIRONMENT")
          if [ "$GOLFSG_BUILD_ENVIRONMENT" = "Staging" ]; then
            environment_args+=(-p:GolfSGStagingApiAddress=https://golfputtingsg-staging.onrender.com/)
          fi
          dotnet publish src/GolfSG/GolfSG.csproj \
            -f net10.0-android -c Release --no-restore \
            -p:AndroidPackageFormats=aab%3Bapk \
            -o artifacts/android "${environment_args[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ env.GOLFSG_BUILD_ENVIRONMENT }}-packaging-check
          path: |
            artifacts/android/**/*.aab
            artifacts/android/**/*.apk
          if-no-files-found: error

  windows:
    name: Windows MSIX build
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302

      - name: Install pinned-workload manifests
        run: dotnet workload install maui --skip-manifest-update

      - name: Restore Windows app
        run: dotnet restore src/GolfSG/GolfSG.csproj

      - name: Publish unsigned MSIX validation package
        run: >-
          dotnet publish src/GolfSG/GolfSG.csproj
          -f net10.0-windows10.0.19041.0
          -c Release
          --no-restore
          -p:RuntimeIdentifierOverride=win-x64
          -p:AppxPackageSigningEnabled=false

      - uses: actions/upload-artifact@v4
        with:
          name: windows-msix-validation
          path: src/GolfSG/bin/Release/net10.0-windows10.0.19041.0/win-x64/AppPackages/**/*
          if-no-files-found: error

  apple:
    name: Apple Release compile check
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302

      - name: Require current App Store SDK generation
        shell: bash
        run: |
          xcodebuild -version
          major=$(xcodebuild -version | awk '/Xcode/{split($2, version, "."); print version[1]}')
          test "$major" -ge 26 || {
            echo "Xcode 26 or newer is required for App Store submissions."
            exit 1
          }

      - name: Install pinned-workload manifests
        run: dotnet workload install maui --skip-manifest-update

      - name: Restore Apple targets
        run: dotnet restore src/GolfSG/GolfSG.csproj

      - name: Compile iOS simulator and Mac Catalyst
        shell: bash
        run: |
          if [ "$(uname -m)" = "arm64" ]; then
            ios_rid=iossimulator-arm64
            mac_rid=maccatalyst-arm64
          else
            ios_rid=iossimulator-x64
            mac_rid=maccatalyst-x64
          fi
          dotnet build src/GolfSG/GolfSG.csproj -f net10.0-ios -c Release --no-restore -p:RuntimeIdentifier="$ios_rid"
          dotnet build src/GolfSG/GolfSG.csproj -f net10.0-maccatalyst -c Release --no-restore -p:RuntimeIdentifier="$mac_rid"

  deploy-staging:
    name: Migrate and deploy staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: [test, backend, android, windows, apple]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: staging
    concurrency:
      group: golfsg-staging-deployment
      cancel-in-progress: false
    env:
      STAGING_DATABASE_SETUP_CONNECTION: ${{ secrets.STAGING_DATABASE_SETUP_CONNECTION }}
      STAGING_RENDER_DEPLOY_HOOK: ${{ secrets.STAGING_RENDER_DEPLOY_HOOK }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302

      - name: Validate staging credentials and target
        run: python3 scripts/deliver_staging.py validate

      - name: Apply staging database migrations
        run: python3 scripts/deliver_staging.py migrate

      - name: Deploy and verify the validated commit
        run: python3 scripts/deliver_staging.py deploy
